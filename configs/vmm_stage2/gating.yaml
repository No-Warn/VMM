# 阶段 2（Eulerian 微运动可靠性门控）配置模板
#
# 用法：python scripts/run_vmm.py --reliability-yaml configs/vmm_stage2/gating.yaml ...
#
# 数学定义见 docs/stage2_design.md：
#   Δφ_out = Δφ + α_eff · w(x,t,s,o) · Δφ_bp ,   w∈[0,1]
#   α_eff  = min(α, β_{s,o})
#
# 全部默认 = 阶段 1 行为（mode: M0，无门控、无上限、无平滑）。

mode: M0                 # M0 | M1（幅值）| M2（+相位稳定性）| M3（+局部一致性）
                         # | B1（幅值+原始谱集中度）| B2（幅值+**归一化**谱集中度，推荐）
                         # | B3（逐像素归一化，仅对照）

# [B2/B3] 谱集中度的度量域：
#   bp  = 带通后的 Φ_bp（与 B1 同数据；窄带/短窗下判别余量只有 0.03–0.14）
#   raw = 原始累积相位 Φ（保留带外信息、余量大 4–8 倍，但绝对水平低 ⇒ 增益更保守）
# 为什么 B2：B1 的 w 是**无量纲比值**，绝对水平随 T 漂移（同一纯正弦 T=64/120/240
# → 0.998/0.719/0.994），直接乘 α 会让"同一条视频只因长度不同就差 23% 增益"。
# B2 除以**同管线**标定的纯带内正弦参考，把 T 依赖消除（详见 docs/stage2_results.md §11）。
band_domain: bp

# 逐带噪声尺度标定文件（由 scripts/stage2_calibrate.py 产出）。
# σ 在**同一金字塔带幅值单位**上测得（静止视频/静止 ROI 的时间标准差 + 稳健分位）。
sigma_from: null         # 例如 configs/vmm_stage2/sigma_baby.json

sigma_scale: 1.0         # g：σ 的缩放（消融用；1.0 = 用标定值）

# §4 amp_floor：运动表示层的**幅值可信度软阈值**（相对本带中位幅值的比例，无量纲）。
# 0 = 关闭；它是软权重 r²/(r²+floor²)，**不会**把低对比度真实运动清零。
amp_floor: 0.0

# §2.3 门控平滑（默认关闭；开启后必须实测运动保留是否被抹掉）
spatial_smooth: 0.0      # 对 w 的空间高斯 σ（单位=该带网格 cell）
temporal_smooth: 0       # 对 w 的时间对称平滑核长（帧）

# M3 的局部一致性邻域半径（该带网格 cell）
coh_radius: 1

# §3 逐尺度逐方向增益上限 β_{s,o}（键 "<level>-<orient>"）。
# 留空 = 不限制。数值必须来自消融实验（见 docs/stage2_results.md），不得手工臆造。
per_band_caps: null

# ---------------------------------------------------------------------------
# 推荐配置（第三轮结论，见 docs/stage2_results.md §11）
# ---------------------------------------------------------------------------
# (a) 需要"增益与片长无关、且不比 E0 放大更多噪声" ⇒ **B2**（默认推荐）
#       mode: B2
#       band_domain: bp
#       sigma_from: configs/vmm_stage2/sigma_baby.json   # 可选：叠加幅值证据 w_A
#    实测（α=10、真实视频）：活动 4.53 / 静止 3.08 / 选择性 1.471（E0 是 4.60/3.21/1.433）
#    合成干净运动（α=5）：增益 = E0 的 1.000 / 1.000 / 1.003（T=64/120/240）
#
# (b) 需要把静止区**绝对能量**压到最低 ⇒ **B1**，但必须同时注明
#     "其中约 2/3 来自全局降增益"（任务书 §8 禁止把整体降增益当去噪成功）：
#       mode: B1
#    实测（α=10、真实视频）：4.31 / 2.88 / 1.497；其中活动区本身也降了 6.3%。
#
# (c) B2r（band_domain: raw）/ B3（逐像素归一化）**仅作对照**：
#    前者在真实/带噪数据上把增益压到 E0 的 0.53–0.88；后者对偏离 DFT 频点的运动
#    （真实运动几乎总是偏离）过度压制（真实视频 α=2 只 1.55，E0 是 1.91）。